# EVT-L001 — RDP Successful Logon
id: EVT-L001
name: "Remote Desktop Protocol Logon"
description: >
  A successful interactive logon via RDP (LogonType 10) was recorded.
  In environments where RDP is not standard, this warrants investigation.
  Correlate with source IP and time-of-day baseline.
severity: medium
mitre: T1021.001
tags: [lateral-movement, rdp]
references:
  - https://attack.mitre.org/techniques/T1021/001/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4624
match:
  event_id: 4624
  channel: Security
  data:
    LogonType: "10"

