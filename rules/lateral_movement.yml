# EVT-L002 — Network Logon to Admin Shares
id: EVT-L002
name: "Network Logon — Possible Admin Share Access"
description: >
  A Type 3 network logon occurred which may indicate access to administrative
  shares (C$, ADMIN$, IPC$). Combined with object access events, this can
  indicate lateral movement via SMB.
severity: low
mitre: T1021.002
tags: [lateral-movement, smb, network-logon]
references:
  - https://attack.mitre.org/techniques/T1021/002/
match:
  event_id: 4624
  channel: Security
  data:
    LogonType: "3"

---
# EVT-L003 — Pass-the-Hash Indicator (NTLMv1 network logon, no workstation name)
id: EVT-L003
name: "Potential Pass-the-Hash — NTLM Network Logon"
description: >
  An NTLM authentication event (LogonType 3, AuthPackage NTLM) without an
  associated workstation name is a common indicator of pass-the-hash attacks.
  Legitimate logons typically include a workstation name.
severity: high
mitre: T1550.002
tags: [lateral-movement, pass-the-hash, ntlm]
references:
  - https://attack.mitre.org/techniques/T1550/002/
  - https://www.ired.team/offensive-security/credential-access-and-credential-dumping/pass-the-hash-with-mimikatz
match:
  event_id: 4624
  channel: Security
  data:
    LogonType: "3"
    AuthenticationPackageName: "NTLM"
    WorkstationName: ""

