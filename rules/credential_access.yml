---
# EVT-C001 — Failed Logon (single)
id: EVT-C001
name: "Failed Logon Attempt"
description: >
  A logon attempt failed (Event 4625). Single occurrence is low-signal,
  but feeds into brute-force threshold rules.
severity: info
mitre: T1110.001
tags: [credential-access, logon-failure]
references:
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4625
  - https://attack.mitre.org/techniques/T1110/001/
match:
  event_id: 4625
  channel: Security

---
# EVT-C002 — Brute Force (threshold: 10 failures in 60s per host/user)
id: EVT-C002
name: "Brute Force Login Attempts"
description: >
  Ten or more consecutive failed logon attempts from the same target account
  within 60 seconds — indicative of automated password guessing.
severity: high
mitre: T1110.001
tags: [credential-access, brute-force]
references:
  - https://attack.mitre.org/techniques/T1110/001/
match:
  event_id: 4625
  channel: Security
threshold:
  count: 10
  window_seconds: 60
  group_by: [computer, data.TargetUserName]

---
# EVT-C003 — Password Spray (many accounts, few failures each)
# Heuristic: LogonType 3 (network) failures across different TargetUserNames
id: EVT-C003
name: "Potential Password Spray — Network Logon Failures"
description: >
  Network logon failures (Type 3) can indicate password spraying when a single
  source attempts low-count failures against many different accounts.
  Correlate with EVT-C002 to distinguish spray from brute force.
severity: high
mitre: T1110.003
tags: [credential-access, password-spray]
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://www.microsoft.com/security/blog/2020/04/23/protecting-organization-password-spray-attacks/
match:
  event_id: 4625
  channel: Security
  data:
    LogonType: "3"
threshold:
  count: 20
  window_seconds: 120
  group_by: [computer, data.IpAddress]

---
# EVT-C004 — LSASS Memory Access (Mimikatz / credential dumping)
id: EVT-C004
name: "LSASS Process Memory Access"
description: >
  A process opened LSASS (lsass.exe) with memory-read access rights.
  This is a primary indicator of credential dumping tools such as Mimikatz.
  Event 10 from Sysmon captures this when process access auditing is enabled.
severity: critical
mitre: T1003.001
tags: [credential-access, lsass, mimikatz]
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://www.ultimatewindowssecurity.com/securitylog/encyclopedia/event.aspx?eventid=4656
match:
  event_id: [4656, 4663]
  channel: Security
  data:
    ObjectName: "lsass.exe"

---
# EVT-C005 — Kerberoasting (SPN ticket request for service account)
id: EVT-C005
name: "Kerberos Service Ticket Request — Possible Kerberoasting"
description: >
  A Kerberos service ticket (TGS) was requested using RC4-HMAC encryption
  (etype 23). RC4 TGS requests against service accounts are the hallmark of
  Kerberoasting attacks aimed at cracking service account password hashes offline.
severity: high
mitre: T1558.003
tags: [credential-access, kerberoasting, kerberos]
references:
  - https://attack.mitre.org/techniques/T1558/003/
  - https://adsecurity.org/?p=3458
match:
  event_id: 4769
  channel: Security
  data:
    TicketEncryptionType: "0x17"    # RC4-HMAC
    TicketOptions: "0x40800000"     # forwardable

---
# EVT-C006 — Explicit Credential Use (runas / lateral movement indicator)
id: EVT-C006
name: "Logon with Explicit Credentials"
description: >
  A process used explicit credentials (Event 4648) to authenticate to another
  system. Common in pass-the-hash, lateral movement, and credential relay attacks.
severity: medium
mitre: T1550.002
tags: [credential-access, lateral-movement, explicit-credentials]
references:
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4648
match:
  event_id: 4648
  channel: Security
