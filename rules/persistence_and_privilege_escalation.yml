# EVT-P006 — Event Log Cleared
id: EVT-P006
name: "Security Event Log Cleared"
description: >
  The Security or System event log was cleared (Event 1102 / 104).
  Log clearing is a strong indicator of post-exploitation anti-forensics.
severity: critical
mitre: T1070.001
tags: [defense-evasion, log-clearing, anti-forensics]
references:
  - https://attack.mitre.org/techniques/T1070/001/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-1102
match:
  event_id: [1102, 104]

