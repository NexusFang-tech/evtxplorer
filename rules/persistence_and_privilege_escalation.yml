# EVT-P007 — PowerShell Script Block Logging
id: EVT-P007
name: "PowerShell Script Block Logged"
description: >
  PowerShell script block logging (Event 4104) captured a script execution.
  Review the script content for encoded commands, download cradles, or
  invocations of reflection/AMSI bypass patterns.
severity: medium
mitre: T1059.001
tags: [execution, powershell, script-block]
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://www.fireeye.com/blog/threat-research/2016/02/greater_visibilityt.html
match:
  event_id: 4104
  channel: "Microsoft-Windows-PowerShell/Operational"
