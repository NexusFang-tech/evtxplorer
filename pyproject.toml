[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evtxplorer"
version = "0.1.0"
description = "Windows Event Log analyzer with YAML-driven MITRE ATT&CK detection rules"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Matt Kardos", email = "nexusfang@proton.me" }]
keywords = ["security", "evtx", "windows", "siem", "mitre", "detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "python-evtx>=0.7.4",
    "pyyaml>=6.0",
    "lxml>=5.0",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
evtxplorer = "evtxplorer.cli:main"

[project.urls]
Homepage = "https://github.com/NexusFang-Tech/evtxplorer"
Repository = "https://github.com/NexusFang-Tech/evtxplorer"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=evtxplorer --cov-report=term-missing"
